name: Publicar landing en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir recomendaciones Te Equipamos
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('gh-pages/index.html')
          html = page.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="https://jorgesport.github.io/te-equipamos-arpenaz-27l/related-content.css">'
          js = '<script src="https://jorgesport.github.io/te-equipamos-arpenaz-27l/related-content.js"></script>'
          if css not in html:
              html = html.replace('</head>', css + '</head>', 1)
          if js not in html:
              html = html.replace('</body>', js + '</body>', 1)
          page.write_text(html, encoding='utf-8')
          PY
      - name: Instalar footer universal Te Equipamos
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('gh-pages/index.html')
          html = page.read_text(encoding='utf-8')
          tag = '<script defer src="https://jorgesport.github.io/te-equipamos/universal-footer.js" data-te-universal-footer-loader></script>'
          if 'data-te-universal-footer-loader' not in html:
              if '</body>' not in html:
                  raise SystemExit('No se encontró </body> para el footer universal')
              html = html.replace('</body>', tag + '</body>', 1)
              page.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages
      - id: deployment
        uses: actions/deploy-pages@v4
